# Chronus for Business — Configuration Template
# Copy this file to config.toml and configure your settings and API keys.

[app]
###############################################################################
# API Service
###############################################################################
listen_host = "127.0.0.1"
listen_port = 8080

# Project Metadata
project_name = "Chronus Video Studio"
project_description = "AI-powered automated short video ad creation platform."
project_version = "1.0.0"

# Optional API Key Authentication for /api/v1 and /tasks.
# Leave empty to keep local unauthenticated access.
# When configured, clients must pass this key via the 'x-api-key' request header.
api_key = ""

# FFmpeg binary path (leave empty for auto-detection)
ffmpeg_path = ""

# Enable hot reloading for development
reload_debug = false

# Edge TTS streaming request timeout in seconds (0 to disable)
edge_tts_timeout = 30.0

# Verify SSL certificates for HTTPS requests (default: true)
verify_ssl = true

###############################################################################
# Video Materials & Stock Providers
###############################################################################
# Pexels API Keys (comma-separated for multi-key rotation)
# Get your free key at: https://www.pexels.com/api/
pexels_api_keys = []

# Pixabay API Keys
# Get your free key at: https://pixabay.com/api/docs/
pixabay_api_keys = []

# TwelveLabs API Keys (for video-understanding & AI search)
# Get your key at: https://twelvelabs.io
twelvelabs_api_keys = []

# Material search settings
material_provider = "pexels"      # "pexels", "pixabay", or "local"
material_search_term_count = 3
material_minimum_duration = 3.0

###############################################################################
# LLM Providers (for AI Copywriting & Script Generation)
###############################################################################
# OpenAI
[openai]
api_key = ""
base_url = "https://api.openai.com/v1"
model_name = "gpt-4o-mini"

# Google Gemini
[gemini]
api_key = ""
model_name = "gemini-2.0-flash"

# Anthropic Claude
[claude]
api_key = ""
model_name = "claude-3-5-sonnet-20241022"

# DeepSeek
[deepseek]
api_key = ""
base_url = "https://api.deepseek.com"
model_name = "deepseek-chat"

# Ollama (Local LLM)
[ollama]
base_url = "http://127.0.0.1:11434"
model_name = "llama3.2"

# OneAPI / Generic OpenAI-Compatible
[oneapi]
api_key = ""
base_url = ""
model_name = ""

###############################################################################
# TTS & Voice Providers
###############################################################################
# Fish Audio (Voice Cloning & High-Fidelity Speech)
# Get your API key at: https://fish.audio
[fish_audio]
api_key = ""

# ElevenLabs
# Get your API key at: https://elevenlabs.io
[elevenlabs]
api_key = ""

# Azure Speech Services
[azure]
speech_key = ""
speech_region = "eastus"

###############################################################################
# Subtitles & Whisper
###############################################################################
[whisper]
model = "base"                    # "tiny", "base", "small", "medium", "large-v3"
device = "cpu"                    # "cpu" or "cuda"
compute_type = "int8"             # "int8" or "float16"

###############################################################################
# Storage & Task Directories
###############################################################################
[storage]
task_dir = "storage/tasks"
cache_dir = "storage/cache"
temp_dir = "storage/temp"
bgm_dir = "resource/songs"
fonts_dir = "resource/fonts"
