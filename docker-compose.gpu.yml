services:
  chronus-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: "chronus-studio-gpu"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./config.toml:/app/config.toml
      - ./storage:/app/storage
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always
